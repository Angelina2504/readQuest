name: CI

on: [push, pull_request]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: readquest_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Create .env
        working-directory: backend
        run: |
          echo 'APP_ENV=dev' > .env
          echo 'APP_SECRET=placeholder' >> .env
          echo 'DATABASE_URL="mysql://root:password@127.0.0.1:3306/readquest?serverVersion=8.4&charset=utf8mb4"' >> .env
      - name: Run migrations
        working-directory: backend
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run PHPUnit
        working-directory: backend
        run: php bin/phpunit

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env
        working-directory: frontend
        run: echo "VITE_API_BASE_URL=http://localhost:8080" > .env

      - name: Run Vitest
        working-directory: frontend
        run: npm run test:unit -- --run
